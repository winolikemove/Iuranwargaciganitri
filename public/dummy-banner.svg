<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="url(#banner-gradient)"/>
  <defs>
    <linearGradient id="banner-gradient" x1="0" y1="0" x2="1200" y2="400">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <!-- Decorative houses -->
  <rect x="50" y="220" width="80" height="120" rx="4" fill="white" fill-opacity="0.2"/>
  <polygon points="90,160 30,220 150,220" fill="white" fill-opacity="0.3"/>
  <rect x="200" y="180" width="100" height="160" rx="4" fill="white" fill-opacity="0.15"/>
  <polygon points="250,100 175,180 325,180" fill="white" fill-opacity="0.25"/>
  <rect x="1000" y="200" width="90" height="140" rx="4" fill="white" fill-opacity="0.2"/>
  <polygon points="1045,140 980,200 1110,200" fill="white" fill-opacity="0.3"/>
  <rect x="850" y="160" width="110" height="180" rx="4" fill="white" fill-opacity="0.15"/>
  <polygon points="905,80 820,160 990,160" fill="white" fill-opacity="0.25"/>
  <!-- Trees -->
  <circle cx="380" cy="280" r="40" fill="white" fill-opacity="0.2"/>
  <rect x="375" y="300" width="10" height="40" fill="white" fill-opacity="0.15"/>
  <circle cx="820" cy="290" r="35" fill="white" fill-opacity="0.2"/>
  <rect x="815" y="310" width="10" height="35" fill="white" fill-opacity="0.15"/>
  <!-- Center text area -->
  <rect x="450" y="100" width="300" height="200" rx="10" fill="white" fill-opacity="0.1"/>
  <text x="600" y="180" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">RT/RW</text>
  <text x="600" y="230" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">Pradha Ciganitri</text>
  <text x="600" y="270" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="Arial, sans-serif" font-size="16">Sistem Manajemen Warga</text>
</svg>
